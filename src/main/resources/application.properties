# ==========================================
# PETCONNECT APPLICATION CONFIGURATION
# ==========================================

# Server Port
server.port=8080

# ==========================================
# DATABASE CONFIGURATION (MySQL)
# ==========================================
# If your MySQL username or password differs from the local default, edit them below.
spring.datasource.url=jdbc:mysql://localhost:3306/petconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Thymeleaf cache for immediate template reloading
spring.thymeleaf.cache=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB

# ==========================================
# SECURITY CONFIGURATION (Temporary default credentials)
# ==========================================
# Spring Security automatically secures all endpoints by default in Phase 1.
# You can log in using user 'user' and the password printed in console, or the configured one below.
spring.security.user.name=user
spring.security.user.password=password

# ==========================================
# MAIL / SMTP CONFIGURATION (Gmail / SMTP)
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:sreenijateeparthi@gmail.com}
spring.mail.password=${MAIL_PASSWORD:hdcexhfcvoufvibr}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Mail Logging & Debugging
logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG
logging.level.jakarta.mail=DEBUG
logging.level.com.petconnect.service.EmailServiceImpl=DEBUG

# ==========================================
# AI SHELTER DOCUMENT VERIFICATION CONFIGURATION
# ==========================================
document.verification.ai-service-url=http://127.0.0.1:8000/verify-document
document.verification.auto-reject-threshold=40
document.verification.low-risk-threshold=85
document.verification.weight.doc-type=15
document.verification.weight.name-match=20
document.verification.weight.address-match=15
document.verification.weight.reg-number-match=20
document.verification.weight.date-validity=10
document.verification.weight.official-verification=10
document.verification.weight.tampering=10
