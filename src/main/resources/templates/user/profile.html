<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - PetConnect</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="layout-wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('user', 'profile')}"></div>

        <div class="content-wrapper">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Sreenija', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200')}"></div>

            <main class="main-content d-flex align-items-center justify-content-center">
                <div class="card border-0 shadow-sm p-4 rounded-card" style="max-width: 600px; width: 100%;">
                    <h3 class="fw-bold mb-4">Manage Profile</h3>
                    
                    <form action="#" method="POST">
                        <div class="mb-3 text-center">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="Avatar" class="rounded-circle shadow-sm border border-purple border-3 mb-2" style="width: 100px; height: 100px; object-fit: cover;">
                            <div>
                                <button type="button" class="btn btn-sm btn-outline-purple py-1 px-3 mt-1">Change Avatar</button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="profileName" class="form-label fw-semibold text-muted small text-uppercase">Full Name</label>
                            <input type="text" class="form-control rounded-pill border-light bg-light py-2 px-3" id="profileName" th:value="${loggedInUser != null ? loggedInUser.fullName : ''}">
                        </div>

                        <div class="mb-3">
                            <label for="profileEmail" class="form-label fw-semibold text-muted small text-uppercase">Email</label>
                            <input type="email" class="form-control rounded-pill border-light bg-light py-2 px-3" id="profileEmail" th:value="${loggedInUser != null ? loggedInUser.email : ''}" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="profilePhone" class="form-label fw-semibold text-muted small text-uppercase">Phone</label>
                            <input type="text" class="form-control rounded-pill border-light bg-light py-2 px-3" id="profilePhone" th:value="${loggedInUser != null ? loggedInUser.phone : ''}">
                        </div>

                        <button type="button" class="btn btn-purple w-100 py-3 mt-3 rounded-pill">Save Profile Changes</button>
                    </form>
                </div>
            </main>

            <!-- Footer -->
            <footer class="footer py-4 text-center mt-auto border-top bg-white">
                <div class="container">
                    <p class="mb-0 text-muted">&copy; 2026 PetConnect. All rights reserved. Connect. Care. Adopt.</p>
                </div>
            </footer>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
