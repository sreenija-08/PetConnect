<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PetConnect</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="layout-wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('public', 'login')}"></div>

        <div class="content-wrapper">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Guest', 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200')}"></div>

            <main class="main-content d-flex align-items-center justify-content-center py-5">
                <div class="card border-0 shadow-sm p-5 rounded-card" style="max-width: 480px; width: 100%;">
                    
                    <!-- IF TOKEN IS INVALID OR EXPIRED -->
                    <div th:if="${invalidToken}" class="text-center py-3">
                        <span class="fs-1 text-danger">⚠️</span>
                        <h3 class="fw-bold mt-3 text-danger">Invalid Link</h3>
                        <p class="text-muted mt-2 mb-4" th:text="${errorMessage}">This password reset link is invalid or has expired.</p>
                        <a href="/forgot-password" class="btn btn-outline-purple rounded-pill px-4 py-2 me-2">Request New Link</a>
                        <a href="/login" class="btn btn-purple rounded-pill px-4 py-2">Back to Login</a>
                    </div>

                    <!-- IF TOKEN IS VALID -->
                    <div th:if="${validToken}">
                        <div class="text-center mb-4">
                            <span class="fs-1">🔑</span>
                            <h2 class="fw-bold mt-2">RESET PASSWORD</h2>
                            <p class="text-muted small">Enter and confirm your new secure password.</p>
                        </div>

                        <!-- Error Banner if validation fails -->
                        <div th:if="${errorMessage}" class="alert alert-danger border-0 py-2 rounded-4 small mb-3 text-center">
                            <span th:text="${errorMessage}">Error message</span>
                        </div>

                        <!-- Reset Password Form -->
                        <form th:action="@{/reset-password}" method="POST" id="resetPasswordForm" class="mb-4">
                            <input type="hidden" name="token" th:value="${token}">

                            <!-- New Password -->
                            <div class="mb-3">
                                <label for="newPassword" class="form-label fw-semibold text-muted small text-uppercase">New Password</label>
                                <div class="password-input-wrapper">
                                    <input type="password" name="password" id="newPassword" 
                                           class="form-control rounded-pill border-light bg-light py-2 px-3" 
                                           placeholder="Create a new password" minlength="6" required autofocus>
                                    <button type="button" class="password-toggle-btn" 
                                            onclick="togglePasswordVisibility('newPassword', this)" 
                                            aria-label="Show password" title="Show password">👁️</button>
                                </div>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-semibold text-muted small text-uppercase">Confirm Password</label>
                                <div class="password-input-wrapper">
                                    <input type="password" name="confirmPassword" id="confirmPassword" 
                                           class="form-control rounded-pill border-light bg-light py-2 px-3" 
                                           placeholder="Confirm your new password" minlength="6" required>
                                    <button type="button" class="password-toggle-btn" 
                                            onclick="togglePasswordVisibility('confirmPassword', this)" 
                                            aria-label="Show password" title="Show password">👁️</button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-purple w-100 py-3 rounded-pill fw-semibold">Reset Password</button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="/login" class="text-purple fw-semibold text-decoration-none small d-inline-flex align-items-center gap-1">
                                <span>←</span> Back to Login
                            </a>
                        </div>
                    </div>

                </div>
            </main>

            <!-- Footer -->
            <footer class="footer py-4 text-center mt-auto border-top bg-white">
                <div class="container">
                    <p class="mb-0 text-muted">&copy; 2026 PetConnect. All rights reserved. Connect. Care. Adopt.</p>
                </div>
            </footer>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Password Visibility Toggle Script -->
    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
                btn.setAttribute('aria-label', 'Hide password');
                btn.setAttribute('title', 'Hide password');
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
                btn.setAttribute('aria-label', 'Show password');
                btn.setAttribute('title', 'Show password');
            }
        }
    </script>
</body>
</html>
