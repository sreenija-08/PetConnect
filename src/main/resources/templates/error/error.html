<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - PetConnect</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .error-card {
            max-width: 520px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(111, 66, 193, 0.08);
            border: 1px solid rgba(111, 66, 193, 0.12);
        }
        .error-icon {
            width: 80px;
            height: 80px;
            background: rgba(111, 66, 193, 0.1);
            color: #6f42c1;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-5">
        <div class="text-center mb-4">
            <a href="/" class="brand text-decoration-none text-dark fs-3 fw-bold">
                <span>🐾</span> PetConnect
            </a>
        </div>

        <div class="card error-card p-5 text-center w-100">
            <div class="error-icon mx-auto">
                ⚠️
            </div>

            <h2 class="fw-bold mb-2 text-dark">Something Went Wrong</h2>
            <p class="text-muted mb-4" th:text="${message != null && !#strings.isEmpty(message) ? message : 'The requested operation could not be completed. Please try again or return to safety.'}">
                The requested operation could not be completed. Please try again or return to safety.
            </p>

            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-medium" onclick="history.back()">
                    ← Go Back
                </button>
                <a href="/" class="btn btn-purple rounded-pill px-4 py-2 fw-medium">
                    Return to Home
                </a>
            </div>
        </div>

        <div class="text-center mt-4 text-muted small">
            &copy; 2026 PetConnect Platform. All rights reserved.
        </div>
    </div>

</body>
</html>
